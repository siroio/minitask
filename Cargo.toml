[package]
name = "minitask"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Markdown task management with a TUI, Emacs frontend, and JSON CLI"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-width = "0.2"
time = { version = "0.3.55", features = ["local-offset", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[target.'cfg(not(windows))'.dependencies]
shell-words = "1"

[profile.release]
lto = "thin"
strip = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "minitask"
path = "src/main.rs"
